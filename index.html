<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Моніторинг СЕС</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="container mt-4">
  <h1>Моніторинг сонячної електростанції (1 МВт)</h1>

  <!-- КАРТКИ -->
  <div class="row">
    <div class="col-md-3"><div class="card-box"><h5>Потужність</h5><h3 id="power">--</h3></div></div>
    <div class="col-md-3"><div class="card-box"><h5>Добова генерація</h5><h3 id="daily">--</h3></div></div>
    <div class="col-md-3"><div class="card-box"><h5>Місячна генерація</h5><h3 id="monthly">--</h3></div></div>
    <div class="col-md-3"><div class="card-box"><h5>Ефективність</h5><h3 id="eff">--</h3></div></div>
  </div>

  <!-- ПАРАМЕТРИ -->
  <div class="row mt-3">
    <div class="col-md-6">
      <div class="info-box">
        <p><b>Освітленість:</b> <span id="irr">--</span></p>
        <p><b>Температура панелей:</b> <span id="temp">--</span></p>
      </div>
    </div>
  </div>

  <!-- ГРАФІК + PIE -->
  <div class="row mt-4">

    <!-- LINE -->
    <div class="col-md-6">
      <div class="chart-card">
        <canvas id="lineChart"></canvas>
      </div>
    </div>

    <!-- PIE -->
    <div class="col-md-6">
      <div class="chart-card d-flex align-items-center">

        <div id="pieLegend" class="pie-legend"></div>

        <div class="pie-chart-wrapper">
          <canvas id="pieChart"></canvas>
        </div>

      </div>
    </div>

  </div>

  <!-- HEATMAP -->
  <div class="mt-4">
    <h4>Heat-map ефективності</h4>
    <div id="heatmap"></div>
  </div>

  <!-- TABLE -->
  <div class="mt-4">
    <h4>Історія</h4>
    <div class="table-container">
      <div id="table"></div>
    </div>
  </div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>

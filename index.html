<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Моніторинг СЕС</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Стилі -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-4">

    <h1 class="text-center mb-4">Моніторинг сонячної електростанції</h1>

    <!-- Alert -->
    <div id="alertBox" class="alert alert-danger text-center d-none">
        ⚠ Критичне відхилення параметрів!
    </div>

    <!-- День/ніч -->
    <div class="text-center mb-3">
        <span id="timeOfDay" class="badge bg-warning text-dark">День</span>
    </div>

    <!-- Параметри -->
    <div class="row g-4">

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Сонячна радіація</h5>
                <p id="radiation"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Потужність</h5>
                <p id="power"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Напруга</h5>
                <p id="voltage"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Температура</h5>
                <p id="temp"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Ефективність</h5>
                <p id="efficiency"></p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card param-card">
                <h5>Інвертор</h5>
                <p id="inverter"></p>
            </div>
        </div>

    </div>

    <!-- Енергія -->
    <div class="text-center mt-4">
        <h4>Вироблена енергія за день:</h4>
        <p id="energy">0 кВт·год</p>
    </div>

    <!-- Кнопка -->
    <div class="text-center mt-3">
        <button class="btn btn-primary" onclick="updateData()">Оновити</button>
    </div>

    <!-- Графік потужності -->
    <div class="mt-5">
        <h4 class="text-center">Динаміка потужності</h4>
        <canvas id="powerChart"></canvas>
    </div>

    <!-- Графік ефективності -->
    <div class="mt-5">
        <h4 class="text-center">Динаміка ефективності</h4>
        <canvas id="effChart"></canvas>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>

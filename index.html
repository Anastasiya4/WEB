<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Реєстр підстанцій</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-light">

<div class="container mt-4">
    <h2 class="text-center mb-3">⚡ Реєстрація підстанцій</h2>

    <div id="message"></div>

    <form id="form" class="card p-3 shadow">

        <input class="form-control mb-2" name="name" placeholder="Найменування" required>

        <select class="form-select mb-2" name="type" required>
            <option value="">Тип підстанції</option>
            <option value="Трансформаторна">Трансформаторна</option>
            <option value="Розподільча">Розподільча</option>
        </select>

        <input class="form-control mb-2" name="address" placeholder="Адреса" required>

        <input type="number" class="form-control mb-2" name="power" placeholder="Потужність (МВА)" required>

        <input class="form-control mb-2" name="voltage" placeholder="Клас напруги" required>

        <input type="number" class="form-control mb-2" name="transformers" placeholder="Кількість трансформаторів" required>

        <input type="number" class="form-control mb-2" name="year"
               placeholder="Рік введення" min="1950" max="2025" required>

        <select class="form-select mb-2" name="status" required>
            <option value="">Стан</option>
            <option value="active">Активна</option>
            <option value="repair">Ремонт</option>
            <option value="аварійна">Аварійна</option>
        </select>

        <button class="btn btn-primary">Додати</button>
    </form>

    <input id="search" class="form-control mt-3" placeholder="Пошук...">

    <select id="filter" class="form-select mt-3">
        <option value="all">Всі</option>
        <option value="active">Активні</option>
        <option value="repair">Ремонт</option>
        <option value="аварійна">Аварійні</option>
    </select>

    <div id="list" class="mt-3"></div>

    <canvas id="chart" class="mt-4"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
